<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Turma · while under_attack</title>
  <link rel="stylesheet" href="estilo.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
  <header class="topo"></header>
  <p class="aviso" id="procedencia"></p>

  <main class="painel">
    <!-- O4: visão consolidada de todos os jogadores (RN-005) -->

    <div class="filtros">
      <label for="f-periodo">Período</label>
      <select class="discreto" id="f-periodo">
        <option value="tudo">Tudo</option>
        <option value="7">Últimos 7 dias</option>
        <option value="14">Últimos 14 dias</option>
        <option value="30">Últimos 30 dias</option>
      </select>

      <label for="f-conceito">Conceito</label>
      <select class="discreto" id="f-conceito">
        <option value="">Todos</option>
      </select>

      <span class="separador"></span>

      <!-- As abas sao o que faz tudo caber sem rolagem: cada uma e uma tela
           cheia, como as paginas de um relatorio do Power BI. -->
      <nav class="abas" id="abas">
        <button class="aba" data-painel="visao" aria-selected="true">Visão geral</button>
        <button class="aba" data-painel="fases" aria-selected="false">As fases</button>
        <button class="aba" data-painel="jogadores" aria-selected="false">Os jogadores</button>
      </nav>
    </div>

    <div class="numeros" id="numeros"></div>

    <!-- ----------------------------------------------------------------- -->
    <section class="painel-aba" data-painel="visao">
      <section class="cartao area-a">
        <h2>O que merece atenção</h2>
        <div class="destaques rola" id="destaques"></div>
      </section>

      <section class="cartao area-b">
        <h2>Em que fases eles param</h2>
        <div class="tela"><canvas id="g-funil"></canvas></div>
      </section>

      <section class="cartao area-c" id="c-atividade">
        <div class="topo-cartao">
          <div><h2>Atividade da turma</h2></div>
          <button class="discreto ver-tabela">Ver tabela</button>
        </div>
        <div class="tela"><canvas id="g-atividade"></canvas></div>
        <div class="tabela-apoio" hidden></div>
      </section>
    </section>

    <!-- ----------------------------------------------------------------- -->
    <section class="painel-aba" data-painel="fases" hidden>
      <section class="cartao area-a">
        <h2 title="RN-012: mediana de tentativas até a primeira vitória, entre quem concluiu a fase. Rastreabilidade completa em /api/procedencia.">Quantas tentativas cada fase custa</h2>
        <div class="tela"><canvas id="g-dificuldade"></canvas></div>
      </section>

      <section class="cartao area-b">
        <h2>A turma aprende tentando?</h2>
        <div class="tela"><canvas id="g-aprendizado"></canvas></div>
      </section>

      <section class="cartao area-c">
        <h2>Venceram aplicando o conceito?</h2>
        <div class="tela"><canvas id="g-conceito"></canvas></div>
      </section>

      <section class="cartao area-d">
        <h2 title="RN-008: bloco em que a execução parou, nas derrotas classificadas como parada num bloco. Rastreabilidade completa em /api/procedencia.">Em que bloco a turma empaca</h2>
        <div class="rola"><table id="t-blocos"></table></div>
      </section>
    </section>

    <!-- ----------------------------------------------------------------- -->
    <section class="painel-aba" data-painel="jogadores" hidden>
      <section class="cartao area-a">
        <h2>Jogador por fase</h2>
        <div class="heatmap rola" id="heatmap"></div>
        <div class="legenda-rampa" id="legenda-rampa"></div>
      </section>

      <section class="cartao area-b">
        <h2>Jogadores</h2>
        <div class="rola"><table id="t-jogadores"></table></div>
      </section>
    </section>
  </main>

  <script type="module" src="professor.js"></script>
</body>
</html>
