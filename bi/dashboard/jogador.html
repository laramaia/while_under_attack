<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meu progresso · while under_attack</title>
  <link rel="stylesheet" href="estilo.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
  <header class="topo"></header>
  <p class="aviso" id="procedencia"></p>

  <main class="painel">
    <div class="filtros">
      <!-- só aparece para o perfil professor, que escolhe de quem é a tela (RN-005) -->
      <p id="escolha-jogador" hidden style="margin:0"></p>
      <span class="separador"></span>
      <nav class="abas" id="abas">
        <button class="aba" data-painel="progresso" aria-selected="true">Meu progresso</button>
        <button class="aba" data-painel="detalhe" aria-selected="false">Fase a fase</button>
      </nav>
    </div>

    <!-- O3: devolver ao jogador um diagnóstico do próprio aprendizado -->
    <div class="numeros" id="numeros"></div>

    <section class="painel-aba" data-painel="progresso">
      <section class="cartao area-a" id="c-tentativas">
        <div class="topo-cartao">
          <div>
            <h2 title="RN-012: conta vitórias e derrotas até a primeira vitória, inclusive. Rastreabilidade completa em /api/procedencia.">Quantas vezes você errou antes de acertar</h2>
          </div>
          <button class="discreto ver-tabela">Ver tabela</button>
        </div>
        <div class="tela"><canvas id="g-tentativas"></canvas></div>
        <div class="tabela-apoio" hidden></div>
      </section>

      <section class="cartao area-b">
        <h2 title="RN-019: o programa da primeira vitória usou o bloco que representa o conceito da fase. Rastreabilidade completa em /api/procedencia.">Você resolveu do jeito que a fase ensina?</h2>
        <div class="rola" id="conceitos-aplicados"></div>
      </section>

      <section class="cartao area-c">
        <h2 title="RN-014: blocos da solução de referência ÷ blocos do programa vencedor. Rastreabilidade completa em /api/procedencia.">O seu código foi enxuto?</h2>
        <div class="tela"><canvas id="g-eficiencia"></canvas></div>
      </section>

      <section class="cartao area-d">
        <h2 title="RN-008: toda derrota é classificada entre programa curto e parada num bloco. Rastreabilidade completa em /api/procedencia.">Por que você perdeu</h2>
        <div class="tela"><canvas id="g-travou"></canvas></div>
      </section>
    </section>

    <section class="painel-aba" data-painel="detalhe" hidden>
      <section class="cartao area-a">
        <h2>Fase a fase</h2>
        <div class="rola"><table id="t-fases"></table></div>
      </section>

      <section class="cartao area-b">
        <h2>Conceitos</h2>
        <div class="rola"><table id="t-conceitos"></table></div>
      </section>
    </section>
  </main>

  <script type="module" src="jogador.js"></script>
</body>
</html>
