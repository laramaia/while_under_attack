<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meu progresso · while under_attack</title>
  <link rel="stylesheet" href="estilo.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
  <header class="faixa" data-titulo="Meu Progresso"></header>
  <p class="aviso" id="procedencia"></p>

  <!-- O3: devolver ao jogador um diagnóstico do próprio aprendizado -->
  <main class="painel">

    <aside class="trilho">
      <!-- só aparece para o perfil professor, que escolhe de quem é a tela (RN-005) -->
      <div id="escolha-jogador" hidden></div>

      <div>
        <h2>Páginas</h2>
        <nav class="abas" id="abas">
          <button class="aba" data-painel="progresso" aria-selected="true">Visão geral</button>
          <button class="aba" data-painel="detalhe" aria-selected="false">Fase a fase</button>
        </nav>
      </div>
    </aside>

    <div class="conteudo">
      <div class="kpis" id="kpis"></div>

      <section class="aba-painel" data-painel="progresso">
        <section class="cartao area-a" id="c-tentativas">
          <h2 title="RN-012: conta vitórias e derrotas até a primeira vitória, inclusive.">Quantas vezes você errou antes de acertar</h2>
          <div class="tela"><canvas id="g-tentativas"></canvas></div>
          <div class="tabela-apoio" hidden></div>
        </section>

        <section class="cartao area-b">
          <h2 title="RN-019: o programa da primeira vitória usou o bloco que representa o conceito da fase.">Resolveu do jeito que a fase ensina?</h2>
          <div class="rola" id="conceitos-aplicados"></div>
        </section>

        <section class="cartao area-c">
          <h2 title="RN-014: blocos da solução de referência ÷ blocos do programa vencedor.">O seu código foi enxuto?</h2>
          <div class="tela"><canvas id="g-eficiencia"></canvas></div>
        </section>

        <section class="cartao area-d">
          <h2 title="RN-008: toda derrota é classificada entre programa curto e parada num bloco.">Por que você perdeu</h2>
          <div class="tela"><canvas id="g-travou"></canvas></div>
        </section>
      </section>

      <section class="aba-painel" data-painel="detalhe" hidden>
        <section class="cartao area-a">
          <h2>Fase a fase</h2>
          <div class="rola"><table id="t-fases"></table></div>
        </section>

        <section class="cartao area-b">
          <h2>Conceitos</h2>
          <div class="rola"><table id="t-conceitos"></table></div>
        </section>
      </section>
    </div>
  </main>

  <script type="module" src="jogador.js"></script>
</body>
</html>
